[package]
name = "codex-quota-tray"
version = "0.1.0"
edition = "2024"
description = "Read-only Codex App Server quota feasibility spike"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"

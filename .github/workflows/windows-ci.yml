name: Windows CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'windows/**'
      - 'global.json'
      - '.github/workflows/windows-ci.yml'
      - '.github/workflows/windows-release.yml'
  push:
    branches:
      - main
    paths:
      - 'windows/**'
      - 'global.json'
      - '.github/workflows/windows-ci.yml'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify WinUI Quick
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File .\windows\scripts\verify-winui.ps1 -Mode Quick
          if ($LASTEXITCODE -ne 0) {
            throw "WinUI Quick verification failed with exit code $LASTEXITCODE."
          }

      - name: Verify WinUI Full
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File .\windows\scripts\verify-winui.ps1 -Mode Full
          if ($LASTEXITCODE -ne 0) {
            throw "WinUI Full verification failed with exit code $LASTEXITCODE."
          }

name: Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare artifact name
        id: metadata
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $safeRefName = $env:REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          $shortSha = $env:COMMIT_SHA.Substring(0, 7)
          $artifactName = "CodexQuotaTray-test-$safeRefName-$shortSha"
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Selected ref: $($env:REF_NAME)"
          Write-Host "Commit: $($env:COMMIT_SHA)"
          Write-Host "Artifact: $artifactName"

      - name: Verify WinUI Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File .\windows\scripts\verify-winui.ps1 -Mode Release
          if ($LASTEXITCODE -ne 0) {
            throw "WinUI Release verification failed with exit code $LASTEXITCODE."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup installation failed.'
          }

          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($command) { $command.Source } else { $null }
          if (-not $iscc) {
            $knownPaths = @(
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
            )
            $iscc = $knownPaths | Where-Object {
              $_ -and (Test-Path -LiteralPath $_ -PathType Leaf)
            } | Select-Object -First 1
          }

          if (-not $iscc) {
            throw 'ISCC.exe was not found after installing Inno Setup.'
          }

          $isccVersion = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($isccVersion)) {
            throw "Could not determine ISCC.exe version: $iscc"
          }

          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ISCC_VERSION=$isccVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using Inno compiler $iscc (version $isccVersion)."

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File .\windows\scripts\package-winui.ps1 -SkipPublish
          if ($LASTEXITCODE -ne 0) {
            throw "Portable ZIP packaging failed with exit code $LASTEXITCODE."
          }

      - name: Build Inno installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          $windowsRoot = Join-Path $repoRoot 'windows'
          pwsh -NoProfile -File .\windows\scripts\package-inno.ps1 `
            -SkipPublish -Iscc $env:ISCC_PATH -RepoRoot $repoRoot -WindowsRoot $windowsRoot `
            -OutputDir (Join-Path $repoRoot 'dist-inno') -PublishDir (Join-Path $repoRoot 'target\winui-publish')
          if ($LASTEXITCODE -ne 0) {
            throw "Inno installer packaging failed with exit code $LASTEXITCODE."
          }

      - name: Validate outputs and generate SHA256SUMS.txt
        id: artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath '.\windows\src\CodexQuotaTray.App\CodexQuotaTray.App.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'CodexQuotaTray.App.csproj does not define a Version.'
          }

          $zip = "dist/CodexQuotaTray-$version-win-x64.zip"
          $installer = "dist-inno/CodexQuotaTray-$version-setup.exe"
          $checksum = 'dist/SHA256SUMS.txt'
          foreach ($path in @($zip, $installer)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required test artifact is missing: $path"
            }
          }

          $lines = foreach ($path in @($zip, $installer)) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }

          [IO.File]::WriteAllText(
            $checksum,
            (($lines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false))

          foreach ($path in @($checksum)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "SHA-256 file was not produced: $path"
            }
          }

          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum=$checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content -LiteralPath $checksum

      - name: Upload test artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.artifacts.outputs.zip }}
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
